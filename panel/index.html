<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEO Automation</title>
    <link rel="icon" type="image/png" href="../icons/icon-32.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: oklch(14.7% 0.004 49.25);
        color: oklch(98.5% 0.001 106.423);
      }

      .veo-prompt-textarea {
        min-height: 14rem;
        overflow-y: auto !important;
        resize: vertical;
      }

      .veo-prompt-mode-list {
        min-height: 11rem;
        height: 11rem;
        overflow: auto;
        resize: vertical;
        overscroll-behavior: contain;
        padding-right: 0.25rem;
      }

      .veo-prompt-queue-list {
        min-height: 6rem;
        height: 10rem;
        overflow: auto;
        resize: vertical;
        overscroll-behavior: contain;
        padding-right: 0.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .veo-prompt-queue-num {
        font-size: 0.65rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="bootstrap.js"></script>
  </body>
</html>
